<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shut the Box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Shut the Box</h1>

    <div id="tiles-container">
        <!-- Tiles will be dynamically generated here -->
    </div>

    <button id="roll-dice-btn">Roll Dice</button>

    <div id="dice-result-display">
        <!-- Dice roll outcome will be shown here -->
    </div>

    <div id="moves-container">
        <!-- Possible moves will be listed here -->
    </div>

    <button id="submit-move-btn">Submit Move</button>

    <div id="message-area">
        <!-- Game messages will be displayed here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
